<div class="header-content">
    <div class="left">
        <img
            (click)="redirect('/home')"
            nbTooltip="Home"
            i18n-nbTooltip="@@core.header.home"
            nbTooltipPlacement="bottom"
            src="favicon.ico"
            alt="Logo"
            class="logo"
        />

        <nb-search
            [nbSpinner]="usersStore.redirectLoading() || usersStore.loading()"
            nbTooltip="Search"
            i18n-nbTooltip="@@core.header.search"
            nbTooltipPlacement="bottom"
            type="modal-zoomin"
        ></nb-search>
        @if (gamesStore.loading()) {
            <app-skeleton width="5.5rem" height="2.5rem" radius="0.25rem" />
        } @else {
            <button
                [nbPopover]="gamesMenuTemplate"
                nbPopoverTrigger="click"
                nbPopoverPlacement="bottom"
                i18n="@@core.header.games"
                nbButton
                ghost
                status="control"
            >
                Games
            </button>
        }
        <button type="button" (click)="redirect('/events')" nbButton ghost status="control" i18n="@@core.header.events">
            Events
        </button>
    </div>

    <div class="right">
        @if (usersStore.isLoggedIn()) {
            <app-notification-bell></app-notification-bell>
            <div
                [nbTooltip]="copied() ? 'Copied' : 'Copy'"
                [nbTooltipStatus]="copied() ? 'success' : 'control'"
                (click)="copyToClipboard()"
                (mouseleave)="copied.set(false)"
                i18n-nbTooltip="{{copied() ? '@@core.header.copied' : '@@core.header.copy'}}"
                nbTooltipPlacement="bottom"
                class="nickname-container"
            >
                <span class="nickname">{{ usersStore.user()?.nickname! }}</span>
                <span class="discriminator">{{ usersStore.discriminator() }}</span>
            </div>
            <app-avatar
                [src]="usersStore.user()?.avatarUrl"
                [nbContextMenu]="usersStore.menuItems()!"
                nbContextMenuTag="header-user"
                nbContextMenuTrigger="hover"
            ></app-avatar>
        } @else {
            <button
                [nbSpinner]="usersStore.redirectLoading() || usersStore.loading()"
                (click)="redirect('/users/login')"
                nbButton
                ghost
            >
                <nb-icon
                    icon="power-outline"
                    pack="eva"
                    i18n-aria-label="@@core.header.login"
                    aria-label="Login"
                ></nb-icon>
            </button>
        }
    </div>
</div>

<ng-template #gamesMenuTemplate>
    <div class="custom-menu">
        @for (group of gamesStore.gameMenu(); track group.title) {
            <div class="menu-group">
                <div class="menu-group-title">{{ group.title }}</div>

                @for (item of group.children; track item.title) {
                    <button type="button" (click)="redirect(item.link || item.url || '/home')" class="menu-item">
                        @if (item.icon) {
                            <img [src]="item.icon" width="20" height="20" class="menu-icon" alt="" />
                        }
                        <span>{{ item.title }}</span>
                    </button>
                }
            </div>
        }
    </div>
</ng-template>
