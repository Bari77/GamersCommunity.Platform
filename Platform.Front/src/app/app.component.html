<nb-layout>
    <nb-layout-header fixed>
        <app-header></app-header>
    </nb-layout-header>

    <nb-layout-column class="app-column">
        <router-outlet />
        @if (isLoading()) {
            <div class="app-loading-overlay">
                <app-loading [message]="loadingMessage()" />
            </div>
        }
    </nb-layout-column>

    <nb-layout-footer fixed>
        <app-footer></app-footer>
    </nb-layout-footer>
</nb-layout>
