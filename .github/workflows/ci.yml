name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

# Prefer a PAT (read:packages) as PACKAGES_READ_TOKEN so CI can install @bari77/* and GamersCommunity.* from other repos.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate GitHub Packages (NuGet)
        run: |
          dotnet nuget update source github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Restore
        run: dotnet restore GamersCommunity.Platform.sln

      - name: Build
        run: dotnet build GamersCommunity.Platform.sln -c Release --no-restore

      - name: Test
        run: dotnet test GamersCommunity.Platform.sln -c Release --no-build --verbosity normal

  front:
    name: Front (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Platform.Front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@bari77"
          cache: npm
          cache-dependency-path: Platform.Front/package-lock.json

      # @bari77 resolved/integrity may be omitted when local packs poisoned the lock shasums
      # (GitHub Packages E409 checksum mismatch). Re-resolve from the registry, then npm ci.
      - name: Install
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      # No *.spec.ts in Platform.Front yet — Karma would fail with an empty suite on CI.
